name: Homelab Heartbeat Watchdog

on:
  schedule:
    # Runs every 5 minutes (standard GitHub Actions cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

env:
  TARGET_URL: 'https://resolva.faisalaffan.com'
  MAX_RETRIES: 3

jobs:
  heartbeat-check:
    name: Probe Homelab Healthz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Ping Homelab Health Endpoint
        id: probe
        run: |
          set -e
          echo "Probing $TARGET_URL..."
          FAIL_COUNT=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: Checking $TARGET_URL..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$TARGET_URL" || echo "000")
            echo "HTTP Status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
              echo "Homelab is ALIVE and healthy ✓"
              echo "is_alive=true" >> $GITHUB_OUTPUT
              exit 0
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
              sleep 5
            fi
          done

          echo "⚠️ Homelab failed $MAX_RETRIES consecutive health checks!"
          echo "is_alive=false" >> $GITHUB_OUTPUT

      - name: Trigger DR Failover Sentinel
        if: steps.probe.outputs.is_alive == 'false'
        run: |
          echo "🚨 Homelab outage detected! Triggering Automated DR Failover Sentinel..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"homelab-down","client_payload":{"reason":"Heartbeat watchdog detected consecutive timeout"}}' || true
