name: Secret & Security Audit

on:
  push:
    branches: ["main", "dev", "fix/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  secret-scan:
    name: Gitleaks & Hardcoded Pattern Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for banned hardcoded secret patterns
        run: |
          if git grep -n -E "(secret_2026|minioadmin|k3s-local-dev-token-2026|ADMIN_PIN[[:space:]]*=[[:space:]]*\"2026\")"; then
            echo "::error::Banned hardcoded credential or fallback pattern detected!"
            exit 1
          fi
          echo "✓ No banned hardcoded credential patterns found."
