---
# Role: tailscale — Install & join Tailscale mesh

- name: Detect OS codename
  shell: . /etc/os-release && echo $VERSION_CODENAME
  register: os_codename
  changed_when: false

- name: Add Tailscale GPG key
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ os_codename.stdout }}.noarmor.gpg \
      | tee /usr/share/keyrings/tailscale-archive-keyring.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg

- name: Add Tailscale repository
  shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ os_codename.stdout }}.tailscale-keyring.list \
      | tee /etc/apt/sources.list.d/tailscale.list
  args:
    creates: /etc/apt/sources.list.d/tailscale.list

- name: Install Tailscale
  apt:
    name: tailscale
    update_cache: true
    state: latest

- name: Enable tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Join Tailscale network
  command: >
    tailscale up
    --authkey={{ vault_tailscale_authkey }}
    --hostname={{ inventory_hostname }}
    {{ tailscale_args | default('--accept-routes') }}
  register: ts_result
  changed_when: "'already' not in ts_result.stderr"

- name: Get Tailscale IP
  command: tailscale ip -4
  register: tailscale_ip
  changed_when: false

- name: Set tailscale_ipv4 fact
  set_fact:
    tailscale_ipv4: "{{ tailscale_ip.stdout | trim }}"

- name: Enable IPv4 and IPv6 forwarding
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop:
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv6.conf.all.forwarding', value: '1' }

- name: Configure iptables FORWARD rules for Tailscale
  iptables:
    chain: FORWARD
    in_interface: "{{ item.in_if | default(omit) }}"
    out_interface: "{{ item.out_if | default(omit) }}"
    jump: ACCEPT
    action: insert
    rule_num: 1
    comment: "tailscale subnet router forward"
  loop:
    - { in_if: 'tailscale0' }
    - { out_if: 'tailscale0' }

- name: Configure iptables NAT MASQUERADE for Tailscale subnet traffic
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ item.src | default(omit) }}"
    out_interface: "{{ item.out_if | default(omit) }}"
    jump: MASQUERADE
    action: insert
    rule_num: 1
    comment: "tailscale subnet router nat"
  loop:
    - { src: '100.64.0.0/10' }
    - { out_if: 'tailscale0' }

- debug:
    msg: "✅ {{ inventory_hostname }} — Tailscale IP: {{ tailscale_ipv4 }}"
