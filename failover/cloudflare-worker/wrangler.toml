name = "dr-failover-controller"
main = "./.output/server/index.mjs"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

# Disable public workers.dev and preview URLs to prevent edge policy bypass
workers_dev = false
preview_urls = false

routes = [
  { pattern = "dr.example.com", custom_domain = true }
]

[assets]
directory = "./.output/public"
binding = "ASSETS"

[vars]
# Non-secret configuration only.
# Sensitive secrets (ADMIN_PIN, CLOUDFLARE_API_KEY/TOKEN, TENCENTCLOUD_SECRET_*, GITHUB_PAT)
# MUST be injected via `wrangler secret put <NAME>`.
CLOUDFLARE_ZONE_ID = "CHANGE_ME_CF_ZONE_ID"
CLOUDFLARE_MASTER_ORIGIN_RECORD = "origin.homelab.example.com"
CLOUDFLARE_HOMELAB_TUNNEL_UUID = "CHANGE_ME_HOMELAB_TUNNEL_UUID"
CLOUDFLARE_TENCENT_TUNNEL_UUID = "CHANGE_ME_TENCENT_TUNNEL_UUID"
CLOUDFLARE_EMAIL = "admin@example.com"
GITHUB_REPO = "example/infra-light"
TENCENTCLOUD_REGION = "ap-singapore"
TENCENT_INSTANCE_ID = "CHANGE_ME_TENCENT_INSTANCE_ID"
