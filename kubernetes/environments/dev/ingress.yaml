# =========================================================================
# Development Ingress Resources — L7 routing for Dev namespaces
# =========================================================================

# --- Resolva (Dev) Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resolva-dev-ingress
  namespace: resolva-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${RESOLVA_DEV_FRONTEND_HOSTNAME}
        - ${RESOLVA_DEV_API_HOSTNAME}
      secretName: resolva-dev-tls
  rules:
    - host: ${RESOLVA_DEV_FRONTEND_HOSTNAME}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: reconciliation-backend-svc
                port:
                  number: ${RESOLVA_DEV_BACKEND_PORT}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciliation-frontend-svc
                port:
                  number: ${RESOLVA_FRONTEND_PORT}
    - host: ${RESOLVA_DEV_API_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciliation-backend-svc
                port:
                  number: ${RESOLVA_DEV_BACKEND_PORT}
---
