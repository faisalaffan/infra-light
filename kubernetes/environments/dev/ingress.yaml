# =========================================================================
# Development Ingress Resources — L7 routing for Dev namespaces
# =========================================================================

# --- Resolva (Dev) Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resolva-dev-ingress
  namespace: resolva-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - resolva-dev.faisalaffan.com
        - resolva-api-dev.faisalaffan.com
      secretName: resolva-dev-tls
  rules:
    - host: resolva-dev.faisalaffan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciliation-frontend-svc
                port:
                  number: 5454
    - host: resolva-api-dev.faisalaffan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciliation-backend-svc
                port:
                  number: 3020
---
