apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ewallet-dev
spec:
  limits:
    - default:
        cpu: "250m"
        memory: 256Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      type: Container
