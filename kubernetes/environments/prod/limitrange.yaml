apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: ewallet
spec:
  limits:
    - default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: "200m"
        memory: 256Mi
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: wasteco
spec:
  limits:
    - default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: "200m"
        memory: 256Mi
      type: Container
