apiVersion: v1
kind: Secret
metadata:
  name: geostack-secrets
  namespace: infra
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${GEOSTACK_POSTGRES_PASSWORD:-geostack_dev_secret_2026}"
  MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
  MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
  KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
  JWT_SECRET: "${GEOSTACK_JWT_SECRET:-geostack_jwt_secret_2026}"
