apiVersion: v1
kind: Service
metadata:
  name: azure-sql-edge
  namespace: infra
  labels:
    app: azure-sql-edge
spec:
  type: ClusterIP
  selector:
    app: azure-sql-edge
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: azure-sql-edge-tailscale
  namespace: infra
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "azure-sql-edge"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: azure-sql-edge
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
