apiVersion: v1
kind: Secret
metadata:
  name: b2-backup-secrets
  namespace: infra
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "${B2_APPLICATION_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${B2_APPLICATION_KEY}"
  AWS_DEFAULT_REGION: "us-east-1"
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  RESTIC_REPOSITORY: "s3:${B2_ENDPOINT}/${B2_BUCKET}/restic-pvs"
  B2_ENDPOINT: "${B2_ENDPOINT}"
  B2_BUCKET: "${B2_BUCKET}"
  KEEP_DAILY: "${RESTIC_RETENTION_KEEP_DAILY}"
  KEEP_WEEKLY: "${RESTIC_RETENTION_KEEP_WEEKLY}"
  KEEP_MONTHLY: "${RESTIC_RETENTION_KEEP_MONTHLY}"
  EXCLUDE_REGISTRY: "${RESTIC_EXCLUDE_REGISTRY}"
