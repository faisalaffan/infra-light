apiVersion: v1
kind: Secret
metadata:
  name: cap-secrets
  namespace: infra
  labels:
    app: cap
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${CAP_MYSQL_ROOT_PASSWORD}"
  MYSQL_PASSWORD: "${CAP_MYSQL_PASSWORD}"
  DATABASE_URL: "mysql://cap:${CAP_MYSQL_PASSWORD}@cap-mysql.infra.svc.cluster.local:3306/cap"
  DATABASE_ENCRYPTION_KEY: "${CAP_DATABASE_ENCRYPTION_KEY}"
  NEXTAUTH_SECRET: "${CAP_NEXTAUTH_SECRET}"
  MEDIA_SERVER_WEBHOOK_SECRET: "${CAP_MEDIA_SERVER_WEBHOOK_SECRET}"
  CAP_AWS_ACCESS_KEY: "${MINIO_ROOT_USER}"
  CAP_AWS_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
  RESEND_API_KEY: "${CAP_RESEND_API_KEY}"
  GOOGLE_CLIENT_ID: "${CAP_GOOGLE_CLIENT_ID}"
  GOOGLE_CLIENT_SECRET: "${CAP_GOOGLE_CLIENT_SECRET}"
  APPLE_CLIENT_ID: "${CAP_APPLE_CLIENT_ID}"
  APPLE_CLIENT_SECRET: "${CAP_APPLE_CLIENT_SECRET}"
  ASSEMBLY_API_KEY: "${CAP_ASSEMBLY_API_KEY}"

