# =========================================================================
# Gitea — self-hosted Git service
# Web: port 3000 (ClusterIP internal) → Ingress (${GITEA_DOMAIN})
# DB: Postgres via env vars; Mailer: SMTP relay; SSH disabled
# =========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: ${GITEA_DATA_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: gitea
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  namespace: infra
data:
  app.ini: |
    APP_NAME = Gitea
    RUN_MODE = prod
    RUN_USER = git

    [server]
    PROTOCOL = http
    DOMAIN = ${GITEA_DOMAIN}
    ROOT_URL = https://${GITEA_DOMAIN}/
    HTTP_PORT = 3000
    LFS_START_SERVER = true
    DISABLE_SSH = true

    [database]
    DB_TYPE = postgres
    HOST = ${GITEA_DB_HOST}:${GITEA_DB_PORT}
    NAME = ${GITEA_DB_NAME}
    USER = ${GITEA_DB_USER}

    [mailer]
    ENABLED = true
    PROTOCOL = smtp
    SMTP_ADDR = ${GITEA_SMTP_HOST}
    SMTP_PORT = ${GITEA_SMTP_PORT}
    FROM = ${GITEA_SMTP_FROM}
    SKIP_VERIFY = true

    [service]
    DISABLE_REGISTRATION = false
    REQUIRE_SIGNIN_VIEW = false

    [oauth2]
    ENABLED = true

    [log]
    MODE = console
    LEVEL = Info

    [security]
    INSTALL_LOCK = true

    [repository]
    ENABLE_PUSH_CREATE_USER = true
    ENABLE_PUSH_CREATE_ORG = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:${GITEA_VERSION}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: GITEA_DB_PASSWORD
            - name: USER
              value: "git"
            - name: GITEA_ADMIN_USER
              value: "${GITEA_ADMIN_USER}"
            - name: GITEA_ADMIN_EMAIL
              value: "${GITEA_ADMIN_EMAIL}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gitea/app.ini
              subPath: app.ini
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: config
          configMap:
            name: gitea-config
