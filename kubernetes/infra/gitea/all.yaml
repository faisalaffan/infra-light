# =========================================================================
# Gitea — self-hosted Git service
# Web: port 3000 (ClusterIP internal) → Ingress (${GITEA_DOMAIN})
# DB: Postgres via env vars; Mailer: SMTP relay; SSH disabled
# Config: env-only (GITEA__section__key) — Gitea auto-generates app.ini on PVC
# =========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: ${GITEA_DATA_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:${GITEA_VERSION}
          ports:
            - containerPort: 3000
              name: http
          env:
            # Database
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: "${GITEA_DB_HOST}:${GITEA_DB_PORT}"
            - name: GITEA__database__NAME
              value: "${GITEA_DB_NAME}"
            - name: GITEA__database__USER
              value: "${GITEA_DB_USER}"
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA__database__SSL_MODE
              value: "disable"
            # Server
            - name: GITEA__server__DOMAIN
              value: "${GITEA_DOMAIN}"
            - name: GITEA__server__ROOT_URL
              value: "https://${GITEA_DOMAIN}/"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__LFS_START_SERVER
              value: "true"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            # Mailer
            - name: GITEA__mailer__ENABLED
              value: "true"
            - name: GITEA__mailer__PROTOCOL
              value: "smtp"
            - name: GITEA__mailer__SMTP_ADDR
              value: "${GITEA_SMTP_HOST}"
            - name: GITEA__mailer__SMTP_PORT
              value: "1025"
            - name: GITEA__mailer__FROM
              value: "${GITEA_SMTP_FROM}"
            - name: GITEA__mailer__SKIP_VERIFY
              value: "true"
            # Service
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            # OAuth2
            - name: GITEA__oauth2__ENABLED
              value: "true"
            # Repository
            - name: GITEA__repository__ENABLE_PUSH_CREATE_USER
              value: "true"
            - name: GITEA__repository__ENABLE_PUSH_CREATE_ORG
              value: "true"
            # Admin auto-create (first boot only)
            - name: GITEA_ADMIN_USER
              value: "${GITEA_ADMIN_USER}"
            - name: GITEA_ADMIN_EMAIL
              value: "${GITEA_ADMIN_EMAIL}"
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: GITEA_ADMIN_PASSWORD
            # Runtime user
            - name: USER
              value: "git"
            - name: GITEA_WORK_DIR
              value: "/data/gitea"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
