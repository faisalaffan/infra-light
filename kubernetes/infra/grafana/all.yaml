apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: ${GRAFANA_DATA_SIZE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        url: http://victoriametrics.infra.svc:8428
        access: proxy
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.infra.svc:3100
        access: proxy
        jsonData:
          derivedFields:
            # Structured Metadata / Label: trace_id -> Tempo Trace
            - name: TraceID
              label: trace_id
              url: '$${__value.raw}'
              urlDisplayLabel: 'View Trace in Tempo'
              datasourceUid: tempo
            # Structured Metadata / Label: trace_id -> Arize Phoenix LLM Tracing
            - name: PhoenixTrace
              label: trace_id
              url: 'https://${PHOENIX_HOSTNAME}/projects/default/traces?trace_id=$${__value.raw}'
              urlDisplayLabel: 'View in Arize Phoenix'
            # Fallback: extract trace_id from log body text
            - name: traceID_body
              matcherRegex: '(?:trace_id|traceId|traceID|traceid)["\s:=]+["\s]*(\w{32,})'
              url: '$${__value.raw}'
              datasourceUid: tempo
            - name: profileId
              matcherRegex: '"profile_id"\s*:\s*"([0-9a-fA-F-]{8,})"'
              url: '$${__value.raw}'
              urlDisplayLabel: 'View Profile in Pyroscope'
              datasourceUid: pyroscope

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.infra.svc:3200
        access: proxy
        jsonData:
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: victoriametrics
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: service_name
              - key: deployment.environment.name
                value: deployment_environment_name
              - key: k8s.cluster.name
                value: k8s_cluster_name
            customQuery: true
            query: '{service_name="$${__span.tags["service.name"]}", deployment_environment_name="$${__span.tags["deployment.environment.name"]}"} | trace_id="$${__trace.traceId}"'
          tracesToMetrics:
            datasourceUid: victoriametrics
            queries:
              - name: "Request Rate (span metrics)"
                query: 'sum(rate(traces_spanmetrics_calls_total{$${__tags}}[5m]))'
              - name: "Error Rate (span metrics)"
                query: 'sum(rate(traces_spanmetrics_calls_total{$${__tags},status_code=~"5.."}[5m]))'
          tracesToProfiles:
            datasourceUid: pyroscope
            tags:
              - key: service.name
                value: service_name

      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://pyroscope.infra.svc:4040
        access: proxy

      - name: PostgreSQL
        type: postgres
        uid: postgresql
        url: postgres.infra.svc:5432
        user: postgres
        secureJsonData:
          password: ${PG_SUPERUSER_PASSWORD}
        jsonData:
          database: postgres
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1700

      - name: Redis
        type: redis-datasource
        uid: redis
        url: redis.infra.svc:6379
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10
          pingInterval: 0
          pipelineWindow: 0
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: "redis-datasource"
          envFrom:
            - secretRef:
                name: infra-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-infra
              mountPath: /etc/grafana/provisioning/dashboards/infra
            - name: dashboards-slo
              mountPath: /etc/grafana/provisioning/dashboards/slo
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "${K8S_REQUESTS_MEMORY}"
              cpu: "${K8S_REQUESTS_CPU}"
            limits:
              memory: "${K8S_LIMITS_MEMORY}"
              cpu: "${K8S_LIMITS_CPU}"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-infra
          configMap:
            name: grafana-dashboards-infra
        - name: dashboards-slo
          configMap:
            name: grafana-dashboards-slo
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
