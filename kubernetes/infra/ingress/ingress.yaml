# =========================================================================
# Ingress resources — L7 routing via ingress-nginx
# Architecture:
#   Internet → Cloudflare Edge → cloudflared → ingress-nginx (ClusterIP) → Services
# cloudflared tunnel di Cloudflare dashboard arahkan ke:
#   http://ingress-nginx-controller.ingress-nginx:80
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ingress
  namespace: infra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: '"${INGRESS_PROXY_BODY_SIZE}"'
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${GRAFANA_DOMAIN}
        - ${CLOUDBEAVER_HOSTNAME}
        - ${MINIO_CONSOLE_HOSTNAME}
        - ${S3_HOSTNAME}
        - ${EXCALIDRAW_HOSTNAME}
        - ${EMQX_DASHBOARD_HOSTNAME}
        - ${MAILPIT_UI_HOSTNAME}
        - ${NATS_UI_HOSTNAME}
        - ${MONGO_UI_HOSTNAME}
        - ${REDIS_UI_HOSTNAME}
        - ${WOODPECKER_SERVER_HOST}
        - ${REDPANDA_CONSOLE_HOSTNAME}
        - ${VAULT_UI_HOSTNAME}
      secretName: infra-tls
  rules:
    - host: ${GRAFANA_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: ${CLOUDBEAVER_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbeaver
                port:
                  number: 8978
    - host: ${MINIO_CONSOLE_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
    - host: ${S3_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: ${EXCALIDRAW_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: excalidraw
                port:
                  number: 80
    - host: ${REDIS_UI_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redis-commander
                port:
                  number: 80
    - host: ${MAILPIT_UI_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
    - host: ${NATS_UI_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nats-headless
                port:
                  number: 8222
    - host: ${MONGO_UI_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mongo-express
                port:
                  number: 8081
    - host: ${EMQX_DASHBOARD_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emqx
                port:
                  number: 18083
    - host: ${WOODPECKER_SERVER_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: woodpecker-server
                port:
                  number: 8000
    - host: ${REDPANDA_CONSOLE_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redpanda-console
                port:
                  number: 8080
    - host: ${VAULT_UI_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200


