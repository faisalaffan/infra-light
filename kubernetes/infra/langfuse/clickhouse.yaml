apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: infra
data:
  retention.xml: |
    <clickhouse>
      <query_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </query_log>
      <text_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </text_log>
      <trace_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </trace_log>
      <metric_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </metric_log>
      <asynchronous_metric_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </asynchronous_metric_log>
      <part_log>
        <ttl>event_time + INTERVAL 7 DAY DELETE</ttl>
      </part_log>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: infra
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native
  selector:
    app: clickhouse
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: infra
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/retention.xml
              subPath: retention.xml
          resources:
            requests:
              memory: "${CLICKHOUSE_MEMORY_REQUEST}"
              cpu: "${CLICKHOUSE_CPU_REQUEST}"
            limits:
              memory: "${CLICKHOUSE_MEMORY_LIMIT}"
              cpu: "${CLICKHOUSE_CPU_LIMIT}"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: ${CLICKHOUSE_DATA_SIZE}
