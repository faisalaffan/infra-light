apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-backup
  namespace: infra
spec:
  schedule: "${LANGFUSE_BACKUP_SCHEDULE}"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: langfuse-backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: langfuse-backup-data
          containers:
            - name: backup
              image: docker.io/faisalaffan/postgres-all:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: "postgres.infra.svc.cluster.local"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: "${PG_SUPERUSER}"
                - name: PGPASSWORD
                  value: "${PG_SUPERUSER_PASSWORD}"
                - name: PGDATABASE
                  value: "langfuse"
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: CLICKHOUSE_PASSWORD
                - name: RETENTION_DAYS
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: LANGFUSE_BACKUP_RETENTION_DAYS
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              command: ["/bin/sh", "-c"]
              args:
                - echo "" | base64 -d | /bin/sh
