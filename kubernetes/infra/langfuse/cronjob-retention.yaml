apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-trace-flush
  namespace: infra
spec:
  schedule: "${LANGFUSE_FLUSH_SCHEDULE}"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: langfuse-trace-flush
        spec:
          restartPolicy: OnFailure
          containers:
            - name: flush
              image: curlimages/curl:8.10.1
              env:
                - name: RETENTION_DAYS
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: LANGFUSE_RETENTION_DAYS
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: CLICKHOUSE_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - echo "" | base64 -d | /bin/sh
