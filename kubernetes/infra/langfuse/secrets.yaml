apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: infra
type: Opaque
stringData:
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
  NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
  SALT: "${LANGFUSE_SALT}"
  ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
  DATABASE_URL: "postgresql://${PG_SUPERUSER}:${PG_SUPERUSER_PASSWORD}@postgres.infra.svc.cluster.local:5432/langfuse"
  DIRECT_URL: "postgresql://${PG_SUPERUSER}:${PG_SUPERUSER_PASSWORD}@postgres.infra.svc.cluster.local:5432/langfuse"
  CLICKHOUSE_URL: "http://clickhouse.infra.svc.cluster.local:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse.infra.svc.cluster.local:9000"
  REDIS_CONNECTION_STRING: "redis://redis.infra.svc.cluster.local:6379"
  LANGFUSE_INIT_PROJECT_RETENTION: "${LANGFUSE_RETENTION_DAYS}"
  LANGFUSE_RETENTION_DAYS: "${LANGFUSE_RETENTION_DAYS}"
  LANGFUSE_BACKUP_RETENTION_DAYS: "${LANGFUSE_BACKUP_RETENTION_DAYS}"
  MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
