apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      enableServiceLinks: false
      containers:
        - name: langfuse-worker
          image: langfuse/langfuse-worker:${LANGFUSE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
              name: health
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3030"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: DIRECT_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_URL
            - name: CLICKHOUSE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_MIGRATION_URL
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: REDIS_HOST
              value: "redis.infra.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: REDIS_CONNECTION_STRING
            - name: NEXTAUTH_URL
              value: "https://${LANGFUSE_HOSTNAME}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: ENCRYPTION_KEY
            - name: LANGFUSE_INIT_PROJECT_RETENTION
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_RETENTION
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio-s3.infra.svc.cluster.local:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ACCESS_KEY
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_SECRET_KEY
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: "http://minio-s3.infra.svc.cluster.local:9000"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ACCESS_KEY
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_SECRET_KEY
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_SECRET_KEY
            - name: AWS_REGION
              value: "us-east-1"
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
