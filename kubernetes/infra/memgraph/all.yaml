# =========================================================================
# Memgraph (with MAGE Graph Algorithms) & Memgraph Lab Web UI
# Ports:
#   - memgraph:7687: Bolt Protocol (Cypher / Neo4j-compatible drivers)
#   - memgraph:7444: WebSocket Log Streaming
#   - memgraph-lab:3000: Memgraph Lab Visual Graph Explorer
# Storage: Local Path Persistent Volume (/var/lib/memgraph)
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: memgraph
  namespace: infra
  labels:
    app: memgraph
spec:
  type: ClusterIP
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
    - port: 7444
      targetPort: 7444
      name: logs
  selector:
    app: memgraph
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: infra
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      securityContext:
        fsGroup: 103
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["chown", "-R", "101:103", "/var/lib/memgraph"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/memgraph
      containers:
        - name: memgraph
          image: memgraph/memgraph-mage:${MEMGRAPH_VERSION}
          imagePullPolicy: IfNotPresent
          args:
            - "--also-log-to-stderr=true"
            - "--telemetry-enabled=false"
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7444
              name: logs
          volumeMounts:
            - name: data
              mountPath: /var/lib/memgraph
          resources:
            requests:
              memory: "${MEMGRAPH_MEMORY_REQUEST}"
              cpu: "${MEMGRAPH_CPU_REQUEST}"
            limits:
              memory: "${MEMGRAPH_MEMORY_LIMIT}"
              cpu: "${MEMGRAPH_CPU_LIMIT}"
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsUser: 101
            runAsGroup: 103
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: ${MEMGRAPH_DATA_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: memgraph-lab
  namespace: infra
  labels:
    app: memgraph-lab
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: memgraph-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memgraph-lab
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memgraph-lab
  template:
    metadata:
      labels:
        app: memgraph-lab
    spec:
      containers:
        - name: memgraph-lab
          image: memgraph/lab:${MEMGRAPH_LAB_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: QUICK_CONNECT_MG_HOST
              value: "memgraph.infra.svc.cluster.local"
            - name: QUICK_CONNECT_MG_PORT
              value: "7687"
          resources:
            requests:
              memory: "${MEMGRAPH_LAB_MEMORY_REQUEST}"
              cpu: "${MEMGRAPH_LAB_CPU_REQUEST}"
            limits:
              memory: "${MEMGRAPH_LAB_MEMORY_LIMIT}"
              cpu: "${MEMGRAPH_LAB_CPU_LIMIT}"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
