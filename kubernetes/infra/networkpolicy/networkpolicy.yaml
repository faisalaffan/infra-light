# =========================================================================
# NetworkPolicy — baseline network security for infra namespace
# Default deny ingress cross-namespace, allow ingress-nginx + monitoring
# =========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        - namespaceSelector:
            matchExpressions:
              - key: environment
                operator: In
                values: ["production", "development"]
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["resolva", "resolva-dev", "ewallet", "ewallet-dev", "wasteco", "wasteco-dev", "geostack"]
        - ipBlock:
            cidr: "${TAILSCALE_SUBNET:-100.64.0.0/10}"
        - ipBlock:
            cidr: "${K3S_POD_CIDR:-10.42.0.0/16}"
        - ipBlock:
            cidr: "${K3S_SERVICE_CIDR:-10.43.0.0/16}"
        - ipBlock:
            cidr: "${NODE_PUBLIC_SUBNET:-139.0.15.88/29}"

