apiVersion: v1
kind: Secret
metadata:
  name: phoenix-secrets
  namespace: infra
  labels:
    app: phoenix
type: Opaque
stringData:
  PHOENIX_SQL_DATABASE_URL: "postgresql://${PG_SUPERUSER}:${PG_SUPERUSER_PASSWORD}@postgres.infra.svc.cluster.local:5432/phoenix"
  PHOENIX_SECRET: "${PHOENIX_SECRET}"
  PHOENIX_ADMIN_SECRET: "${PHOENIX_ADMIN_SECRET}"
  PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: "${PHOENIX_ADMIN_PASSWORD}"

