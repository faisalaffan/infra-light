apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: infra
  labels:
    app: phoenix
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6006
      targetPort: 6006
      protocol: TCP
    - name: grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: phoenix
