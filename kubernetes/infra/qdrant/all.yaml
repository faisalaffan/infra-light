# =========================================================================
# Qdrant — High-Performance Vector Database in Rust (for 1M+ vectors)
# Ports:
#   - 6333: HTTP REST API & Built-in Web UI Dashboard (/dashboard)
#   - 6334: gRPC API
# Storage: Local Path Persistent Volume (/qdrant/storage)
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: infra
  labels:
    app: qdrant
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: infra
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: qdrant
          image: qdrant/qdrant:${QDRANT_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__API_KEY
              value: "${QDRANT_API_KEY}"
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: "0"
            - name: QDRANT__SERVICE__ENABLE_STATIC_CONTENT
              value: "true"
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources:
            requests:
              memory: "${QDRANT_MEMORY_REQUEST}"
              cpu: "${QDRANT_CPU_REQUEST}"
            limits:
              memory: "${QDRANT_MEMORY_LIMIT}"
              cpu: "${QDRANT_CPU_LIMIT}"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: ${QDRANT_DATA_SIZE}
