# =========================================================================
# Resolva API (Reconciliation Backend)
# Framework: Go / Fiber
# Features:
#   - Vault Agent secret injection (secret/data/reconciliation/backend)
#   - Internal ClusterIP service (reconciliation-backend-svc:3020)
#   - Tailscale Mesh LoadBalancer (resolva-api-faisalaffan)
#   - Ingress NGINX / Cloudflare route (resolva-api.faisalaffan.com)
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciliation-backend-sa
  namespace: infra
---
apiVersion: v1
kind: Service
metadata:
  name: reconciliation-backend-svc
  namespace: infra
  labels:
    app: reconciliation-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3020
      targetPort: 3020
      protocol: TCP
  selector:
    app: reconciliation-backend
---
apiVersion: v1
kind: Service
metadata:
  name: resolva-api-ts
  namespace: infra
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "${RESOLVA_API_TS_HOSTNAME}"
  labels:
    app: reconciliation-backend
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 3020
      protocol: TCP
    - name: http-3020
      port: 3020
      targetPort: 3020
      protocol: TCP
  selector:
    app: reconciliation-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-backend
  namespace: infra
  labels:
    app: reconciliation-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciliation-backend
  template:
    metadata:
      labels:
        app: reconciliation-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "reconciliation-backend-role"
        vault.hashicorp.com/agent-inject-secret-.env: "secret/data/reconciliation/backend"
        vault.hashicorp.com/agent-inject-template-.env: |
          {{- with secret "secret/data/reconciliation/backend" -}}
          {{- range $key, $value := .Data.data }}
          {{ $key }}={{ $value }}
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: reconciliation-backend-sa
      containers:
        - name: backend
          image: localhost:5000/reconciliation-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3020
              protocol: TCP
          env:
            - name: SYSTEM_MODE
              value: "PROD"
            - name: VAULT_SECRETS_FILE
              value: "/vault/secrets/.env"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
