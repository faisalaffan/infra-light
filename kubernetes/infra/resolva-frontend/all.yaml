# =========================================================================
# Resolva Frontend (Reconciliation Web UI)
# Framework: Next.js / Node.js
# Port: 5454
# Features:
#   - Internal ClusterIP service (reconciliation-frontend-svc:5454)
#   - Tailscale Mesh LoadBalancer (resolva-faisalaffan)
#   - Ingress NGINX / Cloudflare route (resolva.faisalaffan.com)
# =========================================================================
apiVersion: v1
kind: Service
metadata:
  name: reconciliation-frontend-svc
  namespace: infra
  labels:
    app: reconciliation-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5454
      targetPort: 5454
      protocol: TCP
  selector:
    app: reconciliation-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: resolva-frontend-ts
  namespace: infra
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "${RESOLVA_FRONTEND_TS_HOSTNAME}"
  labels:
    app: reconciliation-frontend
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 5454
      protocol: TCP
    - name: http-5454
      port: 5454
      targetPort: 5454
      protocol: TCP
  selector:
    app: reconciliation-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-frontend
  namespace: infra
  labels:
    app: reconciliation-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciliation-frontend
  template:
    metadata:
      labels:
        app: reconciliation-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:5000/reconciliation-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5454
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5454"
            - name: HOST
              value: "0.0.0.0"
            - name: API_PROXY_TARGET
              value: "http://reconciliation-backend-svc.infra.svc.cluster.local:3020/api/**"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
